[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-realestate-valuation"
version = "0.1.0"
description = "Vietnam real estate asking-price valuation, Conformal Prediction, and mispricing detection (CS114)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19.0",
    "huggingface_hub>=0.23.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "catboost>=1.2.5",
    "transformers>=4.40.0",
    "torch>=2.3.0",
    "pyvi>=0.1.1",
    "datasketch>=1.6.4",
    "shap>=0.45.0",
    "streamlit>=1.35.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.1",
    "nbformat>=5.10.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
